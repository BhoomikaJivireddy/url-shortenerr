<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | URL Shortener</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-card">
        <h1>URL Shortener</h1>
        <h2>Welcome Back</h2>
        <p>Login to manage your shortened URLs.</p>

        <form id="loginForm">

            <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
            >

            <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
            >

            <button type="submit">Login</button>

            <p id="errorMessage"></p>

        </form>

        <p class="switch-page">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>
    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
